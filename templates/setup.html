<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ersteinrichtung – AI-Caller</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    .setup-card { max-width: 460px; width: 100%; margin: auto; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="setup-card">
    <div class="text-center mb-4">
      <i class="bi bi-shield-lock-fill text-warning" style="font-size:2.5rem"></i>
      <h2 class="mt-2 mb-0 fw-bold">Ersteinrichtung</h2>
      <p class="text-secondary small">Lege den ersten Administrator-Account an</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="alert alert-info small mb-3">
          <i class="bi bi-info-circle me-1"></i>
          Es sind noch keine Benutzer vorhanden. Erstelle jetzt den ersten Admin-Account.
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Benutzername</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control" autofocus required
                     autocomplete="username" placeholder="z.B. admin">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Passwort <small class="text-secondary">(mind. 8 Zeichen)</small></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" required
                     autocomplete="new-password" minlength="8">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Passwort bestätigen</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password2" class="form-control" required
                     autocomplete="new-password">
            </div>
          </div>
          <button type="submit" class="btn btn-warning w-100 text-dark fw-semibold">
            <i class="bi bi-person-plus me-1"></i>Admin-Account anlegen
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
