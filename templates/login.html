<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login – AI-Caller</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; background: var(--bs-body-bg); }
    .login-card { max-width: 420px; width: 100%; margin: auto; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="login-card">
    <div class="text-center mb-4">
      <i class="bi bi-telephone-fill text-primary" style="font-size:2.5rem"></i>
      <h2 class="mt-2 mb-0 fw-bold">AI-Caller</h2>
      <p class="text-secondary small">Bitte melden Sie sich an</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        {% if error %}
        <div class="alert alert-danger py-2 small">
          <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label">Benutzername</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input type="text" name="username" class="form-control" autofocus required
                     autocomplete="username">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Passwort</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" required
                     autocomplete="current-password">
            </div>
          </div>
          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="remember" id="chk-remember" value="1">
              <label class="form-check-label small" for="chk-remember">
                Angemeldet bleiben <span class="text-secondary">(3 Monate, kein erneutes 2FA erforderlich)</span>
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>Anmelden
          </button>
        </form>
      </div>
    </div>

    {% if footer_text %}
    <div class="text-center mt-4 text-secondary small d-flex align-items-center justify-content-center gap-2">
      {% if footer_logo_src %}<img src="{{ footer_logo_src }}" style="height:{{ footer_logo_size }}px;opacity:.6">{% endif %}
      <span>{{ footer_text }}{% if footer_show_version %} &middot; v{{ app_version }}{% endif %}</span>
    </div>
    {% endif %}
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
